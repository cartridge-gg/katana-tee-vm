name: Initrd Test

# Builds the canonical sealed initrd (same invocation as the release
# workflow, minus OVMF) on every push to main and every PR, then boot-tests
# it with scripts/test-initrd.sh: plain-QEMU direct kernel boot, guest init
# comes up, Katana is started through the virtio-serial control channel,
# and the forwarded RPC endpoint answers starknet_chainId.
#
# Runner
# ------
# Stock ubuntu-latest. No SEV-SNP hardware is needed: the smoke test boots
# without OVMF/SEV, and the sealed-mode initrd takes its unsealed mount path
# (plain ext4 on /dev/sda) when the cmdline carries no
# KATANA_EXPECTED_LUKS_UUID. Docker (for the static cryptsetup build) and
# /dev/kvm are both available on ubuntu-latest.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: initrd-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pin SOURCE_DATE_EPOCH to HEAD commit time
        # Same rationale as release.yml: without this, build.sh falls back to
        # wall clock and the initrd bytes differ on every run of the same
        # source. Not strictly required for a smoke test, but it keeps CI
        # builds byte-comparable to local builds of the same ref.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          # musl-tools:      linker for the snp-derivekey musl build
          # zstd, cpio:      initrd packaging
          # qemu-system-x86: plain-QEMU boot smoke test (no SEV needed)
          # socat:           control-channel client used by test-initrd.sh
          sudo apt-get install -y --no-install-recommends \
            musl-tools zstd cpio qemu-system-x86 socat

      - name: Install Rust musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Enable KVM for the runner user
        # ubuntu-latest exposes /dev/kvm but root-only by default.
        # test-initrd.sh falls back to TCG emulation without it, which makes
        # the Katana boot far slower and flakier under the test timeout.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download katana linux binary (latest release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .katana-dl
          # Portable build only — the anchored `_linux_amd64.tar.gz` suffix
          # cannot match the `_native` variant (same pattern as release.yml).
          # No tag argument: gh downloads from the latest release.
          gh release download \
            --repo dojoengine/katana \
            --pattern '*_linux_amd64.tar.gz' \
            --dir .katana-dl/
          tar -xzf .katana-dl/*.tar.gz -C .katana-dl/
          KATANA_BIN="$(find .katana-dl -type f -name katana -perm -u+x | head -n1)"
          if [ -z "$KATANA_BIN" ]; then
            echo "katana binary not found in downloaded asset" >&2
            exit 1
          fi
          echo "KATANA_BIN=$KATANA_BIN" >> "$GITHUB_ENV"

      - name: Build kernel + sealed initrd
        # Skips OVMF — the EDK2 build takes far longer than everything else
        # combined and the plain-QEMU boot test doesn't load firmware. The
        # kernel component just downloads the pinned Ubuntu .deb (vmlinuz is
        # needed for direct kernel boot below).
        run: ./build.sh --katana "$KATANA_BIN" kernel initrd

      - name: Boot smoke test
        # --output-dir is required: the script's default resolves relative to
        # scripts/, not the repo root where build.sh writes its artifacts.
        run: ./scripts/test-initrd.sh --output-dir output/qemu --timeout 300

      - name: Upload initrd for debugging
        # Only on failure — the artifact exists to reproduce a failed boot
        # locally (qemu -kernel/-initrd against the exact CI-built image).
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: initrd-debug
          path: |
            output/qemu/initrd.img
            output/qemu/build-info.txt
          if-no-files-found: ignore
