name: Release VM Image

# Builds the Katana TEE VM image (OVMF + kernel + initrd, with a katana
# binary embedded in the initrd), computes the sealed-storage SEV-SNP
# launch measurement, and attaches the artifacts to a GitHub Release when
# a katana-v* tag is pushed.
#
# Trigger contract
# ----------------
# Push a tag named `katana-vX.Y.Z` (or `katana-vX.Y.Z-pipeline.N` for a
# pipeline-only re-release against the same katana). The katana version is
# parsed from the tag and used to download the matching katana binary from
# dojoengine/katana releases:
#   katana-v1.0.0              -> katana version v1.0.0
#   katana-v1.0.0-pipeline.2   -> katana version v1.0.0
#   katana-v1.0.0-rc.1         -> katana version v1.0.0-rc.1  (passes through;
#                                  requires a matching v1.0.0-rc.1 katana release)
#
# Runner
# ------
# Runs on stock `ubuntu-latest`. None of the build steps require AMD SEV-SNP
# hardware — OVMF is cross-compiled, kernel comes from a Ubuntu .deb,
# snp-digest is pure userspace hashing. SEV-SNP hardware is only needed at
# VM-boot time, which is outside this workflow.

on:
  push:
    tags: ['katana-v*']
  workflow_dispatch:
    inputs:
      katana_version:
        description: 'Katana release tag to bundle (used only for workflow_dispatch; e.g. v1.0.0, or "latest")'
        required: true
        default: 'latest'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # nasm, iasl, uuid-dev: EDK2 / OVMF build toolchain
          # musl-tools:           linker for the snp-derivekey musl cross-compile
          # zstd, cpio:           initrd packaging
          sudo apt-get install -y --no-install-recommends \
            nasm iasl uuid-dev \
            musl-tools \
            zstd cpio

      - name: Install Rust musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Resolve katana version
        id: katana
        run: |
          # On tag push: strip leading "katana-" and any "-pipeline.*" suffix.
          # On workflow_dispatch: use the user-provided input.
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            v="${GITHUB_REF_NAME#katana-}"
            v="${v%-pipeline.*}"
          else
            v="${{ github.event.inputs.katana_version }}"
            [ -z "$v" ] && v="latest"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Resolved katana version: $v"

      - name: Download katana linux binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .katana-dl
          # dojoengine/katana publishes per-tag: katana_<version>_linux_amd64.tar.gz
          # (portable) and katana_<version>_linux_amd64_native.tar.gz (CPU-tuned).
          # We want the portable build — the `_linux_amd64.tar.gz` suffix uniquely
          # matches it (anchored to end, so it cannot match the `_native` variant).
          gh release download "${{ steps.katana.outputs.version }}" \
            --repo dojoengine/katana \
            --pattern '*_linux_amd64.tar.gz' \
            --dir .katana-dl/
          tar -xzf .katana-dl/*.tar.gz -C .katana-dl/
          KATANA_BIN="$(find .katana-dl -type f -name katana -perm -u+x | head -n1)"
          if [ -z "$KATANA_BIN" ]; then
            echo "katana binary not found in downloaded asset" >&2
            exit 1
          fi
          echo "KATANA_BIN=$KATANA_BIN" >> "$GITHUB_ENV"

      - name: Build VM image
        run: ./build.sh --katana "$KATANA_BIN"

      - name: Build snp-tools
        # snp-tools binaries are NOT shipped as release artifacts (separate
        # release stream). We build them here only so the next step can run
        # snp-digest to compute the published launch measurement.
        working-directory: snp-tools
        run: cargo build --release

      - name: Compute sealed launch measurement
        run: |
          . ./build-config
          . ./sealed-cmdline.sh
          LUKS_UUID="$KATANA_CANONICAL_LUKS_UUID"
          # Validate canonical UUID format (matches start-vm.sh:174).
          if [[ ! "$LUKS_UUID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "KATANA_CANONICAL_LUKS_UUID is not a canonical lowercase UUID: $LUKS_UUID" >&2
            exit 1
          fi
          CMDLINE="$(build_sealed_cmdline "$LUKS_UUID")"
          DIGEST=$(./snp-tools/target/release/snp-digest \
            --ovmf=output/qemu/OVMF.fd \
            --kernel=output/qemu/vmlinuz \
            --initrd=output/qemu/initrd.img \
            --append="$CMDLINE" \
            --vcpus=1 --cpu=epyc-v4 --vmm=qemu --guest-features=0x1)
          # Validate digest is a 64-char lowercase hex string.
          if [[ ! "$DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "snp-digest produced unexpected output: $DIGEST" >&2
            exit 1
          fi
          echo "Launch measurement: $DIGEST"
          echo "$DIGEST" > output/qemu/launch-measurement.txt
          {
            echo ""
            echo "# Sealed launch measurement (canonical project-wide LUKS_UUID from build-config)"
            echo "LUKS_UUID=${LUKS_UUID}"
            echo "LAUNCH_MEASUREMENT=${DIGEST}"
          } >> output/qemu/build-info.txt

      - name: Stage release artifacts
        run: |
          mkdir -p release
          tag="${GITHUB_REF_NAME:-dev}"
          tar -czf "release/katana-tee-vm-${tag}.tar.gz" -C output/qemu .
          cp output/qemu/build-info.txt "release/build-info-${tag}.txt"
          cp output/qemu/launch-measurement.txt "release/launch-measurement-${tag}.txt"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: katana-tee-vm
          path: release/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/katana-tee-vm-*.tar.gz
            release/build-info-*.txt
            release/launch-measurement-*.txt
